apiVersion: batch/v1
kind: Job
metadata:
  name: flowforge-migrate
  namespace: flowforge
  labels:
    app.kubernetes.io/name: flowforge-migrate
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowforge-migrate
        app.kubernetes.io/component: migration
    spec:
      serviceAccountName: flowforge
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ghcr.io/victorodoyo/flowforge-ml-serving-platform:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/.venv/bin/alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: flowforge-config
          env:
            - name: FLOWFORGE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flowforge-secrets
                  key: database-url
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
