name: flowforge

x-flowforge-environment: &flowforge-environment
  FLOWFORGE_ENVIRONMENT: local
  FLOWFORGE_DATABASE_URL: postgresql+asyncpg://flowforge:flowforge-local@postgres:5432/flowforge
  FLOWFORGE_REDIS_URL: redis://redis:6379/0
  FLOWFORGE_CELERY_BROKER_URL: redis://redis:6379/1
  FLOWFORGE_CELERY_RESULT_BACKEND: redis://redis:6379/2
  FLOWFORGE_JWT_SECRET: local-compose-secret-change-before-deployment

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flowforge
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: flowforge-local
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge -d flowforge"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    environment: *flowforge-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
    environment: *flowforge-environment
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
    command:
      - /app/.venv/bin/celery
      - -A
      - flowforge.tasks.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=workflows,maintenance
      - --concurrency=2
    environment: *flowforge-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
    command:
      - /app/.venv/bin/celery
      - -A
      - flowforge.tasks.celery_app:celery_app
      - beat
      - --loglevel=INFO
    environment: *flowforge-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    image: nginx:1.29-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
